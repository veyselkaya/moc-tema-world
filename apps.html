<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MOC Tema World uygulamasını App Store veya Google Play'den indirin.">
    <meta name="theme-color" content="#8B4513">
    <title>MOC Tema World — Uygulamayı İndir</title>
    <link rel="icon" type="image/png" href="moc_logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #2b1d12;
            background: linear-gradient(135deg, #f5f0eb 0%, #e8e0d5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(70, 40, 15, 0.15);
            padding: 40px 28px;
            text-align: center;
        }
        .logo-wrap {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 28px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(70, 40, 15, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-wrap img { width: 88%; height: auto; }
        h1 {
            color: #8B4513;
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .subtitle {
            color: #6b513b;
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .stores { display: flex; flex-direction: column; gap: 14px; }
        .store-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #1c1c1e;
            color: #fff;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
        }
        .store-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 18px rgba(0, 0, 0, 0.22); }
        .store-btn .icn { width: 26px; height: 26px; flex: 0 0 26px; }
        .store-btn .lbl { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
        .store-btn .lbl small { font-size: 11px; opacity: 0.75; font-weight: 500; }
        .store-btn.android { background: #0f9d58; }
        .highlight { outline: 3px solid #ffcc66; outline-offset: 3px; }
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #8a7560;
            line-height: 1.5;
        }
        .footer a { color: #8B4513; text-decoration: none; }
        @media (max-width: 380px) {
            .card { padding: 32px 20px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo-wrap">
            <img src="moc_logo.png" alt="MOC Tema World" onerror="this.style.display='none'">
        </div>
        <h1>MOC Tema World</h1>
        <p class="subtitle">Uygulamayı indirmek için cihazınıza uygun mağazayı seçin.</p>

        <div class="stores">
            <a id="ios-btn" class="store-btn ios" href="https://apps.apple.com/tr/app/moc-tema-world/id6762509709?l=tr" rel="noopener">
                <svg class="icn" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M16.365 1.43c0 1.14-.46 2.23-1.21 3.04-.81.88-2.13 1.56-3.21 1.47-.14-1.11.42-2.27 1.16-3.04.83-.88 2.27-1.55 3.26-1.47zM20.5 17.36c-.55 1.27-.81 1.84-1.52 2.96-.99 1.56-2.39 3.5-4.12 3.51-1.54.02-1.93-1-4.02-.99-2.09.01-2.52 1.01-4.06.99-1.73-.02-3.05-1.77-4.04-3.33C.85 17.4-.18 13.92.7 11.13c.62-1.95 1.95-3.18 3.43-3.85 1.5-.69 2.93-.97 4.49-.97 1.55 0 2.65.39 4.04.97 1.36.57 2.18.91 3.86.85 1.66-.06 2.86-.49 3.79-1.06.78.51 1.85 1.46 2.34 2.95-2.06 1.13-3.41 3.03-3.41 5.12 0 2.34 1.74 4.21 3.62 5.21-.18.55-.39 1.02-.36 1.01z"/>
                </svg>
                <span class="lbl"><small>İndir</small>App Store</span>
            </a>

            <a id="android-btn" class="store-btn android" href="https://play.google.com/store/apps/details?id=com.moccoffee.temaWorldMoc&pcampaignid=web_share" rel="noopener">
                <svg class="icn" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M3.6 1.92c-.36.39-.57.99-.57 1.78v16.6c0 .79.21 1.39.58 1.78l.07.06 9.31-9.3v-.22L3.68 1.86l-.08.06zM16.81 14.62l-3.1-3.1v-.22l3.1-3.1.07.04 3.67 2.09c1.05.59 1.05 1.57 0 2.16l-3.67 2.09-.07.04zM13.71 11.41l9.43-9.43c.31.32.49.81.49 1.45 0 .27-.18.59-.49.91l-9.43 9.43-3.1-3.1L13.71 11.41zM10.61 11.41L1.18 1.98c-.31.32-.49.81-.49 1.45v17.14c0 .64.18 1.13.49 1.45l9.43-9.43-3.1-3.18 3.1-3.1z"/>
                </svg>
                <span class="lbl"><small>İndir</small>Google Play</span>
            </a>
        </div>

        <p class="footer">
            © MOC Coffee · <a href="privacy-policy.html">Gizlilik</a> · <a href="support.html">Destek</a>
        </p>
    </main>

    <script>
        (function () {
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Mac') && 'ontouchend' in document);
            var isAndroid = /Android/i.test(ua);
            var iosBtn = document.getElementById('ios-btn');
            var androidBtn = document.getElementById('android-btn');
            if (isIOS) { iosBtn.classList.add('highlight'); }
            else if (isAndroid) { androidBtn.classList.add('highlight'); }
        })();
    </script>
</body>
</html>
